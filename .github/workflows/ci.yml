name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  server-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run server tests
        run: npm test

  # FIL-98 (P0.8): os testes de isolamento entre tenants (RLS) só existem com
  # Postgres real — sem TEST_DATABASE_URL o node:test os marca como `skipped` e
  # o `server-test` acima fica verde sem ter provado nada. Este job é um job
  # PRÓPRIO (e não um passo do `backend-image`) de propósito: ali o Postgres
  # serve ao smoke da imagem candidata a produção, um objetivo diferente, e
  # misturar os dois faria um portão de segurança depender do build do Docker.
  # Aqui a suíte roda inteira contra um Postgres 16 do runner, com as 26
  # migrações aplicadas — e `RLS_OBRIGATORIO=1` faz teste pulado FALHAR
  # (test/run-tests.js), porque teste que não roda não pode se disfarçar de
  # teste que passou.
  server-test-rls:
    runs-on: ubuntu-latest
    # Rede de segurança: a suíte com banco real leva ~1 min. Se um teste
    # pendurar um handle aberto, o job iria até o teto de 6h do GitHub queimando
    # minutos e deixando o PR "pendente" para sempre. Trava tem que virar
    # vermelho rápido.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: olume
          POSTGRES_PASSWORD: olume
          POSTGRES_DB: olume_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olume"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Conexão direta (sem "-pooler"), como o scripts/migrar.js exige: o lock
      # de migração é de sessão. O usuário do service container é superusuário,
      # então o CREATE ROLE falatta_app das migrações passa.
      - name: Aplicar as migrações no Postgres da CI
        run: npm run migrar
        env:
          DATABASE_URL: postgres://olume:olume@127.0.0.1:5432/olume_ci
      # DATABASE_URL fica FORA daqui de propósito: a suíte não deve falar com o
      # banco pelo pool da aplicação, só pelos testes que pedem TEST_DATABASE_URL.
      - name: Suíte do server contra Postgres real (RLS obrigatório)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://olume:olume@127.0.0.1:5432/olume_ci
          RLS_OBRIGATORIO: '1'

  client-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build client
        run: npm run build

  # FIL-92 (P0.8): bloqueia merge com vulnerabilidade high/critical conhecida
  # nas dependências declaradas (server e client).
  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [server, client]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: npm audit (bloqueia high/critical)
        run: npm audit --omit=dev --audit-level=high

  # FIL-92 (P0.8): a imagem candidata a produção precisa construir a partir de
  # um clone limpo e, de fato, subir — migração + boot completo — antes que o
  # Coolify receba o gatilho de deploy (docs/DEPLOY_VPS.md, P0.1 e P0.4).
  backend-image:
    runs-on: ubuntu-latest
    needs: server-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: olume
          POSTGRES_PASSWORD: olume
          POSTGRES_DB: olume_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olume"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # FIL-113: `--build-arg OLUME_COMMIT_SHA` é o que faz a imagem saber qual
      # commit ela é. Sem ele a imagem sobe com `origem: "desconhecida"` e o
      # smoke abaixo fica vermelho — de propósito: uma imagem sem marcador
      # quebra o portão de versão do deploy, e isso tem que aparecer aqui, não
      # em staging.
      - name: Build imagem do backend
        run: |
          docker build -t olume-chat-server:ci -f Dockerfile . \
            --build-arg OLUME_COMMIT_SHA=${{ github.sha }}
      # Segredos dummy DISTINTOS (32+ chars): sem eles, auth/secret.js e
      # operador/segredo.js tentam GERAR e gravar um segredo em
      # /app/server/.env — e a pasta pertence a root (0755), então o node
      # não-root morre com EACCES antes de abrir a porta. São descartáveis,
      # gerados a cada run — nunca usados fora deste smoke.
      - name: Gerar segredos dummy do smoke
        id: dummy
        run: |
          {
            echo "jwt=$(openssl rand -hex 32)"
            echo "operador_jwt=$(openssl rand -hex 32)"
            echo "ia_crypto=$(openssl rand -hex 32)"
            echo "storage_signing=$(openssl rand -hex 32)"
            echo "webhook_verify=$(openssl rand -hex 32)"
            echo "meta_app_secret=$(openssl rand -hex 32)"
          } >> "$GITHUB_OUTPUT"
      - name: Subir o container (roda a migração no entrypoint)
        run: |
          docker run -d --name backend-ci --network host \
            -e NODE_ENV=production \
            -e PORT=10000 \
            -e DATABASE_URL="postgres://olume:olume@127.0.0.1:5432/olume_ci" \
            -e META_APP_SECRET="${{ steps.dummy.outputs.meta_app_secret }}" \
            -e WEBHOOK_VERIFY_TOKEN="${{ steps.dummy.outputs.webhook_verify }}" \
            -e JWT_SECRET="${{ steps.dummy.outputs.jwt }}" \
            -e OPERADOR_JWT_SECRET="${{ steps.dummy.outputs.operador_jwt }}" \
            -e IA_CRYPTO_KEY="${{ steps.dummy.outputs.ia_crypto }}" \
            -e STORAGE_SIGNING_SECRET="${{ steps.dummy.outputs.storage_signing }}" \
            -e APP_URL=http://127.0.0.1:10000 \
            olume-chat-server:ci
      # FIL-113: além de "respondeu", este smoke prova que a resposta DIZ QUAL
      # BUILD respondeu, e que o valor é o commit desta execução. É a garantia
      # de que o marcador que o deploy vai comparar existe de verdade na imagem
      # publicada — se alguém remover o build-arg, o cabeçalho de versao.js ou o
      # campo da resposta, o vermelho aparece no PR, não no ar.
      - name: Smoke de /health/live (e do marcador de versão)
        env:
          SHA_ESPERADO: ${{ github.sha }}
        run: |
          set -euo pipefail
          CORPO=""
          for i in $(seq 1 30); do
            if CORPO="$(curl -fsS http://127.0.0.1:10000/health/live)"; then
              echo "[smoke] container respondeu: ${CORPO}"
              break
            fi
            CORPO=""
            sleep 2
          done
          if [ -z "$CORPO" ]; then
            echo "::error::[smoke] container não respondeu em tempo hábil"
            exit 1
          fi
          # `2>/dev/null || true`: corpo que não é JSON vira SERVIDO vazio e cai
          # na mensagem abaixo, em vez de matar o passo com um erro cru do jq.
          SERVIDO="$(printf '%s' "$CORPO" | jq -er '.versao.sha // ""' 2>/dev/null || true)"
          if [ "$SERVIDO" != "$SHA_ESPERADO" ]; then
            echo "::error::[smoke] a imagem respondeu com versao.sha='${SERVIDO:-<ausente>}', e o esperado era '${SHA_ESPERADO}'. Sem esse marcador correto o smoke de deploy não consegue provar a versão que está no ar (FIL-113) — confira o --build-arg OLUME_COMMIT_SHA no build acima, a gravação de /app/BUILD_SHA no Dockerfile e server/versao.js."
            exit 1
          fi
          echo "[smoke] marcador de versão confere: ${SERVIDO}"
      - name: Logs do container (diagnóstico)
        if: always()
        run: docker logs backend-ci || true
      - name: Encerrar o container
        if: always()
        run: docker rm -f backend-ci || true
      # FIL-99 (review Codex, P1): backend-image só CONSTRÓI. Quem publica é o
      # job publicar-imagens, que exige sucesso de toda a CI (server-test,
      # client-build, npm-audit, backend-image, frontend-image) — assim
      # nenhuma imagem chega ao registry a partir de um commit com CI vermelha
      # em outra frente.
      - name: Salvar imagem do backend como artefato
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save -o /tmp/olume-chat-server.tar olume-chat-server:ci
      - name: Upload do artefato do backend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: /tmp/olume-chat-server.tar
          retention-days: 1

  # FIL-92 (P0.8): build reproduzível do frontend (P0.3) — mesma origem que o
  # Coolify vai construir/publicar.
  # FIL-99: duas imagens do MESMO commit porque VITE_API_URL é embutido no
  # bundle em build-time — não dá para promover o bundle de staging para
  # produção, ele apontaria para a API errada.
  frontend-image:
    runs-on: ubuntu-latest
    needs: client-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build imagem do frontend (staging)
        run: |
          docker build -t olume-chat-client-staging:ci -f client/Dockerfile client \
            --build-arg VITE_API_URL=https://api-staging.olumechat.com.br/api \
            --build-arg VITE_COMERCIAL_EMAIL=comercial@olumechat.com.br \
            --build-arg OLUME_COMMIT_SHA=${{ github.sha }}
      - name: Build imagem do frontend (produção)
        run: |
          docker build -t olume-chat-client-prod:ci -f client/Dockerfile client \
            --build-arg VITE_API_URL=https://api.olumechat.com.br/api \
            --build-arg VITE_COMERCIAL_EMAIL=comercial@olumechat.com.br \
            --build-arg OLUME_COMMIT_SHA=${{ github.sha }}
      # FIL-113: as DUAS imagens são conferidas, e por HTTP, não por `cat` no
      # arquivo. O que precisa ser verdade é que o Nginx SERVE /version.json —
      # um `location` mal ordenado devolveria index.html com 200, que é
      # exatamente a falha silenciosa que este marcador existe para impedir.
      #
      # A de produção entra aqui porque é ela que o FIL-113 deixa pronta para o
      # smoke de produção do FIL-101: descobrir lá que o marcador não é servido
      # seria descobrir com cliente do outro lado.
      - name: Provar que as duas imagens servem /version.json com o SHA do commit
        env:
          SHA_ESPERADO: ${{ github.sha }}
        run: |
          set -euo pipefail

          conferir() {
            local imagem="$1" nome="$2" corpo="" servido=""
            docker run -d --name "verif-${nome}" -p 8080:80 "$imagem" >/dev/null
            for i in $(seq 1 20); do
              if corpo="$(curl -fsS http://127.0.0.1:8080/version.json)"; then break; fi
              corpo=""
              sleep 1
            done
            docker rm -f "verif-${nome}" >/dev/null

            if [ -z "$corpo" ]; then
              echo "::error::[${nome}] /version.json não respondeu. O Nginx precisa servir esse caminho para o marcador de versão (FIL-113) ser verificável — confira o location em client/nginx.conf."
              return 1
            fi
            # `jq -e` também reprova corpo que não é JSON — o sintoma de
            # /version.json ter caído no fallback de SPA e devolvido index.html.
            servido="$(printf '%s' "$corpo" | jq -er '.sha // ""' 2>/dev/null || true)"
            if [ "$servido" != "$SHA_ESPERADO" ]; then
              echo "::error::[${nome}] /version.json trouxe sha='${servido:-<ausente ou não-JSON>}', e o esperado era '${SHA_ESPERADO}'. Corpo: $(printf '%s' "$corpo" | head -c 200 | tr '\n' ' ')"
              return 1
            fi
            echo "[${nome}] /version.json confere: ${servido}"
          }

          conferir olume-chat-client-staging:ci staging
          conferir olume-chat-client-prod:ci prod
      - name: Encerrar containers de verificação
        if: always()
        run: docker rm -f verif-staging verif-prod 2>/dev/null || true
      # FIL-99 (review Codex, P1): frontend-image só CONSTRÓI — ver comentário
      # equivalente em backend-image. publicar-imagens é quem faz login e push.
      - name: Salvar imagens do frontend como artefatos
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/images
          docker save -o /tmp/images/olume-chat-client-staging.tar olume-chat-client-staging:ci
          docker save -o /tmp/images/olume-chat-client-prod.tar olume-chat-client-prod:ci
      - name: Upload dos artefatos do frontend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-images
          path: /tmp/images
          retention-days: 1

  # FIL-99 (review Codex, P1 + P2): único job com packages: write. Só roda em
  # push na main e só depois que TODA a CI (não só o smoke do backend) tiver
  # passado — o `needs` abaixo é a garantia central do desenho: "a imagem que
  # produção recebe é exatamente a que passou em toda a validação".
  publicar-imagens:
    runs-on: ubuntu-latest
    # FIL-98: server-test-rls entra aqui pelo mesmo motivo dos demais — sem ele,
    # a imagem que produção recebe poderia vir de um commit cujo portão de
    # isolamento entre tenants ficou vermelho.
    needs: [server-test, server-test-rls, client-build, npm-audit, backend-image, frontend-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Baixar artefato do backend
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: /tmp/images
      - name: Baixar artefatos do frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-images
          path: /tmp/images
      - name: Carregar imagens no Docker
        run: |
          docker load -i /tmp/images/olume-chat-server.tar
          docker load -i /tmp/images/olume-chat-client-staging.tar
          docker load -i /tmp/images/olume-chat-client-prod.tar
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # P2: docker push sobrescreve a tag sem perguntar, e um re-run no MESMO
      # commit não é reproduzível (a base node:24-bookworm-slim e as
      # dependências de sistema mudam por baixo). Se a tag sha-<commit> já
      # existe no registry, o push é pulado — a tag imutável nunca troca de
      # digest por baixo de quem já promoveu/validou aquele SHA.
      - name: Publicar imagens no GHCR (tag imutável, nunca sobrescreve)
        run: |
          set -euo pipefail
          SHA_SHORT="${GITHUB_SHA:0:7}"

          publicar() {
            local_tag="$1"
            remote_image="$2"
            # docker buildx imagetools inspect: consulta o manifesto remoto sem
            # exigir o flag experimental do `docker manifest`.
            if inspect="$(docker buildx imagetools inspect "$remote_image" 2>/dev/null)"; then
              digest="$(echo "$inspect" | awk '/^Digest:/{print $2; exit}')"
              echo "::warning::${remote_image} já existe no GHCR — push pulado para preservar a tag imutável. Digest válido: ${digest:-desconhecido}"
              return 0
            fi
            docker tag "$local_tag" "$remote_image"
            docker push "$remote_image"
            echo "Publicado: $remote_image"
          }

          publicar olume-chat-server:ci "ghcr.io/bronze-ff/olumechat-server:sha-${SHA_SHORT}"
          publicar olume-chat-client-staging:ci "ghcr.io/bronze-ff/olumechat-client-staging:sha-${SHA_SHORT}"
          publicar olume-chat-client-prod:ci "ghcr.io/bronze-ff/olumechat-client-prod:sha-${SHA_SHORT}"

# FIL-98: o teste de RLS contra Postgres real saiu desta lista — roda no job
# `server-test-rls` acima, contra o Postgres do runner (branch Neon efêmera é
# mais lenta e não acrescenta nada para RLS).
# TODO (FIL-92, fora deste PR — dependem de credencial de CI):
# - scan de secrets (ex.: gitleaks) e scan de vulnerabilidade de imagem
#   (ex.: trivy) nas imagens de backend/frontend;
# - validação das migrations numa branch Neon descartável (não no Postgres
#   efêmero do job acima, que não reproduz extensões/config do Neon).
# Ver docs/DEPLOY_VPS.md §5 (P0.8) para o escopo completo.
