# Olumechat Workflow Update Deployment Pipeline

## Action

Follow the update-deployment-pipeline workflow:
1. Edit .github/workflows/ci.yml to adjust CI steps, environment variables, or add new jobs.
2. Update Dockerfile and/or client/Dockerfile for new Node.js versions, build args, or multi-stage builds.
3. Modify client/nginx.conf for asset caching or routing changes.
4. Update server/docker-entrypoint.sh or scripts/migrar.js for migration or boot logic.
5. Synchronize package.json engines fields and related package-lock.json if necessary.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: .github/workflows/ci.yml, Dockerfile, client/Dockerfile

