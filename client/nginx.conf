# FIL-92 (P0.3): fallback de SPA para todas as rotas (/login, /admin,
# /operador...) — sem isso, abrir ou recarregar uma rota direto no container
# devolve 404 porque o arquivo não existe no disco (só existe na app React).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Assets com hash no nome (o Vite gera <nome>.<hash>.<ext>) são imutáveis:
    # um deploy novo gera hash novo, nunca reaproveita o nome de um arquivo
    # antigo — por isso pode cachear "para sempre".
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca em cache longo — senão o navegador serve um HTML velho
    # apontando pra assets com hash antigo que não existem mais.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
