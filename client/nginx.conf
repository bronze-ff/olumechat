# FIL-92 (P0.3): fallback de SPA para todas as rotas (/login, /admin,
# /operador...) — sem isso, abrir ou recarregar uma rota direto no container
# devolve 404 porque o arquivo não existe no disco (só existe na app React).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Só a saída HASHEADA do Vite (dist/assets/*) é imutável: o nome muda a
    # cada build, nunca reaproveita o de um arquivo antigo — por isso pode
    # cachear "para sempre". NÃO estender isso ao resto de client/public/
    # (favicon, /brand/*, /marketing/*, manifest): esses mantêm o MESMO nome
    # entre deploys — com immutable, uma logo atualizada ficaria presa em
    # cache por 1 ano.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca em cache longo — senão o navegador serve um HTML velho
    # apontando pra assets com hash antigo que não existem mais.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Passthrough de client/public/ (favicon, /brand/*, /marketing/*,
    # manifest) — mesmo nome entre deploys, então cache curto e revalidável,
    # nunca immutable.
    location ~* \.(?:png|jpe?g|gif|svg|webp|ico|webmanifest)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
